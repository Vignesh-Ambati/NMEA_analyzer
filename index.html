<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMEA Log Analyzer</title>
    <meta name="description" content="Professional GNSS/NMEA log parser and visualization suite with multi-task analysis, interactive charts, trajectory mapping, and telemetry console." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NMEA Log Analyzer" />
    <meta property="og:description" content="Professional GNSS/NMEA log parser and visualization suite with multi-task analysis, interactive charts, trajectory mapping, and telemetry console." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NMEA Log Analyzer" />
    <meta name="twitter:description" content="Professional GNSS/NMEA log parser and visualization suite with multi-task analysis, interactive charts, trajectory mapping, and telemetry console." />

    <!-- SVG Favicon to avoid 404 requests -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E05318'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var match = document.cookie.match(/(?:^|; )nmea_theme=([^;]*)/);
          var saved = match ? decodeURIComponent(match[1]) : null;
          if (!saved) {
            saved = window.localStorage ? window.localStorage.getItem('nmea_theme') : null;
          }
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F2EB] text-[#24211D] dark:bg-slate-950 dark:text-slate-100 antialiased font-sans transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
